<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сапер — WebDataRocks</title>

  <!-- WebDataRocks -->
  <link rel="stylesheet" href="https://cdn.webdatarocks.com/latest/webdatarocks.min.css" />
  <script src="https://cdn.webdatarocks.com/latest/webdatarocks.toolbar.min.js"></script>
  <script src="https://cdn.webdatarocks.com/latest/webdatarocks.js"></script>


  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="game-window">

  <!-- Заголовок у стилі Windows 95 -->
  <div class="window-title">
    <span class="window-title__name">💣 Сапер</span>
    <div class="window-controls">
      <div class="win-btn">_</div>
      <div class="win-btn">□</div>
      <div class="win-btn" onclick="document.querySelector('.game-window').style.display='none'">✕</div>
    </div>
  </div>

  <!-- Табло -->
  <div class="scoreboard">
    <div class="lcd" id="mine-counter">040</div>

    <button class="reset-btn" id="reset-btn" title="Нова гра (R)">🙂</button>

    <div class="lcd" id="timer">000</div>
  </div>

  <!-- Перемикач режиму -->
  <div class="mode-bar">
    <span id="mode-label">🖱️ Відкрити</span>
    <label class="toggle-switch" title="Перемкнути режим (F)">
      <input type="checkbox" id="mode-toggle" />
      <span class="toggle-track"></span>
    </label>
    <span class="mode-bar__hint">ПКМ = 🚩 завжди</span>
  </div>

  <!-- Поле (WebDataRocks) -->
  <div class="board-wrapper">
    <div id="pivot-container"></div>

    <!-- Оверлей кінця гри -->
    <div class="game-overlay" id="game-overlay">
      <div class="overlay-card">
        <div id="overlay-title"> Перемога!</div>
        <div id="overlay-msg">Поле розчищено!</div>
        <button class="overlay-btn" id="overlay-btn">Нова гра</button>
      </div>
    </div>
  </div>

  <!-- Хоткеї -->
  <div class="hotkeys">
    R — нова гра &nbsp;|&nbsp; F — режим прапорця &nbsp;|&nbsp; ПКМ — прапорець/? завжди
  </div>

</div><!-- /.game-window -->



<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>

<script>
  // Створюємо гру
  const game = new MinesweeperGame(
    GAME_CONFIG.ROWS,
    GAME_CONFIG.COLS,
    GAME_CONFIG.MINES
  );

  //  Створюємо UI (без renderer — він ще не готовий)
  let ui; 

  // Створюємо renderer
  const renderer = new MinesweeperRenderer(
    "pivot-container",
    game,
    (row, col, isRightClick) => {
      // Callback від renderer → UI обробляє клік
      if (ui) ui.handleCellClick(row, col, isRightClick);
    }
  );

  // Ініціалізуємо WebDataRocks
  renderer.init();

  // Ініціалізуємо UI
  ui = new MinesweeperUI(game, renderer);
</script>

</body>
</html>
